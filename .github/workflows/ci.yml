name: CI

on:
  pull_request:
  workflow_call: # pushes to main run CI through release.yml before releasing

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Lint workflows and action
        run: uvx --from actionlint-py actionlint
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh bin/skopos-post
      - name: Lint Python
        run: uvx ruff check .
      - name: Unit tests
        run: uv run --no-project --with pytest --with pyyaml python -m pytest -q tests
