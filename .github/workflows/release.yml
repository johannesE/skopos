# Every push to main is released: CI runs first, then scripts/next-release.sh
# picks the version from the commit messages since the last tag (Conventional
# Commits: "type!:" or "BREAKING CHANGE:" -> major, "feat:" -> minor, else patch),
# a GitHub release vX.Y.Z is created, and the major tag (v1) is moved to it,
# which is what consumers reference with `uses: johannesE/skopos@v1`.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Releases run one after another, never in parallel, so versions cannot collide.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release and move the major tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # history and tags, to find the last release
          persist-credentials: false

      - name: Work out the next version
        id: version
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: bash scripts/next-release.sh >> "$GITHUB_OUTPUT"

      # The major tag moves first: the release tag is what marks this commit as
      # released, so if anything fails before it exists, a re-run recomputes the
      # same version and retries both steps (the tag move is idempotent).
      - name: Move the major tag and create the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
          SHA: ${{ github.sha }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MAJOR" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$MAJOR" -f sha="$SHA" > /dev/null
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file "$NOTES_FILE" --latest
          echo "Released $TAG and moved $MAJOR to ${SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"
